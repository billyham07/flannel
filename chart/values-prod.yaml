---
# Reproduces the hand-applied deployment on the 5-node production cluster.
# Kept in-tree so a reinstall does not lose the configuration that only ever
# existed as kubectl patches.
podCidr: "10.10.128.0/18"

flannel:
  backend: "cloudflare-mesh"
  image:
    repository: docker.io/sgabpw/flannel-cloudflare-mesh
    # Keep the human-readable tag in sync with the digest-pinned image below.
    tag: mesh-p3-tunbatch-zcopy-20260824
    digest: sha256:25c5dedbccab72ad45a51b9a7b12f90bd77e309e63faf4caa66c70ee3330e8c0
  # The pod uses host networking. Loopback keeps pprof and mesh transport
  # counters node-local while still allowing kubectl debug / nsenter access.
  extraEnv:
    - name: CLOUDFLARE_MESH_PPROF_ADDR
      value: "127.0.0.1:6060"
    # UDP GSO reduced CPU in gray testing, but increased loss on this public
    # path. Keep it opt-in until the path policer / pacing interaction is fixed.
    - name: QUIC_GO_DISABLE_GSO
      value: "true"

cloudflareMesh:
  enabled: true
  # accountID is intentionally absent: supply it with a second -f
  # override file (see values-account.yaml.example) so the account
  # identifier is not tracked in git.
  clusterName: "production"
  connectorPrefix: "flannel-"
  secretPrefix: "cloudflare-mesh-node-"
  connectorHA: false
  meshCIDR: "100.96.0.0/12"
  routeTable: 51820
  mtu: 1280
  keepalivePeriod: "30s"
  connectTimeout: "3m"
  stateHostPath: "/var/lib/flannel/cloudflare-mesh"
  apiTokenSecret:
    name: "cloudflare-mesh-api-token"
    key: "api-token"
  operator:
    replicas: 2
    syncPeriod: "15s"
    registrationGC: "on"
    registrationGCPeriod: "10m"
  coreDNSNodeHosts:
    enabled: true
    namespace: "kube-system"
    configMapName: "coredns"
    dataKey: "NodeHosts"
    hostnameSuffix: "-mesh"
    rolloutKind: "daemonset"
    rolloutName: "coredns"
