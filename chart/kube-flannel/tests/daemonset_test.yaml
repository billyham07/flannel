suite: test daemonset
templates:
  - daemonset.yaml
tests:
  - it: should have the correct api version
    asserts:
      - isKind:
          of: DaemonSet
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: metadata.name
          value: kube-flannel-ds

  - it: should have the correct image
    set:
      flannel.image.repository: cicker.io/flannel/flannel
      flannel.image.tag: v555.44.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: cicker.io/flannel/flannel:v555.44.3
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: cicker.io/flannel/flannel:v555.44.3

  - it: should have the correct cni image
    set:
      flannel.flannel_cni.image.repository: cicker.io/flannel/flannel-cni-plugin
      flannel.flannel_cni.image.tag: v777.66.5
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: cicker.io/flannel/flannel-cni-plugin:v777.66.5

  - it: should pin the flannel image by digest when configured
    set:
      flannel.image.repository: cicker.io/flannel/flannel
      flannel.image.tag: ignored
      flannel.image.digest: sha256:0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: cicker.io/flannel/flannel@sha256:0123456789abcdef
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: cicker.io/flannel/flannel@sha256:0123456789abcdef

  - it: should have the correct args
    set:
      flannel.args:
        - "--ip-masq"
        - "--kube-subnet-mgr"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - "/opt/bin/flanneld"
            - "--ip-masq"
            - "--kube-subnet-mgr"
            - "--healthz-port=8081"

  - it: should render the healthz port and probes by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: healthz
            containerPort: 8081
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /readyz
            port: healthz

  - it: should not render healthz settings when disabled
    set:
      flannel.healthz.port: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - "/opt/bin/flanneld"
            - "--ip-masq"
            - "--kube-subnet-mgr"
      - notExists:
          path: spec.template.spec.containers[0].ports
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: should have the correct image pull secrets
    set:
      global.imagePullSecrets:
        - name: "a-test-secret"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: "a-test-secret"

  - it: should add the install-cni init container when default values are used
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: install-cni
          any: true

  - it: should not add the install-cni init container when skipCNIConfigInstallation is set
    set:
      flannel.skipCNIConfigInstallation: true
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: install-cni
          any: true

  - it: should render nodeSelector when set
    set:
      flannel.nodeSelector:
        eks.amazonaws.com/compute-type: hybrid
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["eks.amazonaws.com/compute-type"]
          value: hybrid

  - it: should mount native Mesh state and TUN without host PID
    set:
      flannel.backend: cloudflare-mesh
      cloudflareMesh.enabled: true
      cloudflareMesh.accountID: 0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: true
      - notExists:
          path: spec.template.spec.hostPID
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: dev-net-tun
            mountPath: /dev/net/tun
      - contains:
          path: spec.template.spec.volumes
          content:
            name: dev-net-tun
            hostPath:
              path: /dev/net/tun
              type: CharDevice
