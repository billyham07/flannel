{{- if .Values.cloudflareMesh.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-mesh-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: cloudflare-mesh-operator
spec:
  replicas: {{ int .Values.cloudflareMesh.operator.replicas }}
  selector:
    matchLabels:
      app: cloudflare-mesh-operator
  template:
    metadata:
      labels:
        app: cloudflare-mesh-operator
    spec:
      hostNetwork: true
      priorityClassName: system-cluster-critical
      tolerations:
      - effect: NoExecute
        operator: Exists
      - effect: NoSchedule
        operator: Exists
      serviceAccountName: cloudflare-mesh-operator
      containers:
      - name: operator
        image: {{ default .Values.flannel.image.repository .Values.cloudflareMesh.operator.image.repository }}:{{ default .Values.flannel.image.tag .Values.cloudflareMesh.operator.image.tag }}
        command:
        - /opt/bin/cloudflare-mesh-operator
        args:
        - --cloudflare-account-id={{ required "cloudflareMesh.accountID is required" .Values.cloudflareMesh.accountID }}
        - --cloudflare-api-token-file=/var/run/secrets/cloudflare-mesh/api-token
        - --namespace={{ .Release.Namespace }}
        - --leader-election-namespace={{ .Release.Namespace }}
        - --cluster-name={{ .Values.cloudflareMesh.clusterName }}
        - --connector-prefix={{ .Values.cloudflareMesh.connectorPrefix }}
        - --secret-prefix={{ .Values.cloudflareMesh.secretPrefix }}
        - --sync-period={{ .Values.cloudflareMesh.operator.syncPeriod }}
        - --connector-ha={{ .Values.cloudflareMesh.connectorHA }}
        - --mesh-pod-enabled={{ .Values.cloudflareMesh.meshPod.enabled }}
        - --mesh-pod-image={{ .Values.cloudflareMesh.meshPod.image.repository }}{{- if .Values.cloudflareMesh.meshPod.image.digest }}@{{ .Values.cloudflareMesh.meshPod.image.digest }}{{- else }}:{{ .Values.cloudflareMesh.meshPod.image.tag }}{{- end }}
        - --mesh-pod-image-pull-policy={{ .Values.cloudflareMesh.meshPod.image.pullPolicy }}
        - --mesh-pod-name-prefix={{ .Values.cloudflareMesh.meshPod.namePrefix }}
        - --mesh-state-host-path={{ .Values.cloudflareMesh.meshPod.stateHostPath }}
        - --mesh-srcnat-enabled={{ .Values.cloudflareMesh.meshPod.srcnatEnabled }}
        {{- if .Values.cloudflareMesh.operator.nodeSelector }}
        - --node-selector={{ .Values.cloudflareMesh.operator.nodeSelector }}
        {{- end }}
        {{- with .Values.cloudflareMesh.operator.extraEnv }}
        env:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: api-token
          mountPath: /var/run/secrets/cloudflare-mesh
          readOnly: true
        resources:
          {{- toYaml .Values.cloudflareMesh.operator.resources | nindent 10 }}
      volumes:
      - name: api-token
        secret:
          secretName: {{ .Values.cloudflareMesh.apiTokenSecret.name }}
          items:
          - key: {{ .Values.cloudflareMesh.apiTokenSecret.key }}
            path: api-token
{{- end }}
