{{- if and .Values.cloudflareMesh.enabled (ne .Values.flannel.backend "cloudflare-mesh") }}
{{- fail "cloudflareMesh.enabled requires flannel.backend=cloudflare-mesh" }}
{{- end }}
{{- if and (eq .Values.flannel.backend "cloudflare-mesh") (not .Values.cloudflareMesh.enabled) }}
{{- fail "flannel.backend=cloudflare-mesh requires cloudflareMesh.enabled=true" }}
{{- end }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: kube-flannel-cfg
  namespace: {{ .Release.Namespace }}
  labels:
    tier: node
    app: flannel
data:
  cni-conf.json: {{ .Values.flannel.cniConf | toJson }}
  net-conf.json: |
    {
{{- if .Values.podCidr }}
      "Network": {{ .Values.podCidr | quote }},
{{- else }}
      "EnableIPv4": false,
{{- end }}
{{- if .Values.podCidrv6 }}
      "IPv6Network": {{ .Values.podCidrv6 | quote }},
      "EnableIPv6": true,
{{- end }}
{{- if .Values.flannel.enableNFTables }}
      "EnableNFTables": true,
{{- end }}
      "Backend": {
{{- if eq .Values.flannel.backend "vxlan" }}
{{- if .Values.flannel.backendPort }}
        "Port": {{ .Values.flannel.backendPort }},
{{- end }}
{{- if .Values.flannel.vni }}
        "VNI": {{ .Values.flannel.vni }},
{{- end }}
{{- if .Values.flannel.GBP }}
        "GBP": {{ .Values.flannel.GBP }},
{{- end }}
{{- if .Values.flannel.directRouting }}
        "DirectRouting": {{ .Values.flannel.directRouting }},
{{- end }}
{{- if .Values.flannel.mtu }}
        "MTU": {{ .Values.flannel.mtu }},
{{- end }}
{{- if .Values.flannel.macPrefix }}
        "MacPrefix": {{ .Values.flannel.macPrefix | quote }},
{{- end }}
        "Type": {{ .Values.flannel.backend | quote }}
{{- else if eq .Values.flannel.backend "wireguard" }}
{{- if .Values.flannel.backendPort }}
        "ListenPort": {{ .Values.flannel.backendPort }},
{{- end }}
{{- if .Values.flannel.backendPortv6 }}
        "ListenPortV6": {{ .Values.flannel.backendPortv6 }},
{{- end }}
{{- if .Values.flannel.psk }}
        "PSK": {{ .Values.flannel.psk | quote }},
{{- end }}
{{- if .Values.flannel.mtu }}
        "MTU": {{ .Values.flannel.mtu }},
{{- end }}
{{- if .Values.flannel.tunnelMode }}
        "Mode": {{ .Values.flannel.tunnelMode }},
{{- end }}
{{- if .Values.flannel.keepaliveInterval }}
        "PersistentKeepaliveInterval": {{ .Values.flannel.keepaliveInterval }},
{{- end }}
        "Type": {{ .Values.flannel.backend | quote }}
{{- else if eq .Values.flannel.backend "udp" }}
{{- if .Values.flannel.backendPort }}
        "Port": {{ .Values.flannel.backendPort }},
{{- end }}
        "Type": {{ .Values.flannel.backend | quote }}
{{- else if eq .Values.flannel.backend "cloudflare-mesh" }}
        "Type": "cloudflare-mesh",
        "ControlPlaneMode": "operator",
        "OperatorNamespace": {{ .Release.Namespace | quote }},
        "OperatorSecretPrefix": {{ .Values.cloudflareMesh.secretPrefix | quote }},
{{- if .Values.cloudflareMesh.meshPod.enabled }}
        "WARPMode": "external",
{{- else }}
        "WARPMode": "host-cli",
        "WARPCLI": "nsenter",
        "WARPCLIArgs": ["-t", "1", "-m", "-u", "-i", "-n", "-p", "--", "warp-cli"],
{{- end }}
        "WARPInterface": "CloudflareWARP",
        "MeshCIDR": {{ .Values.cloudflareMesh.meshCIDR | quote }},
        "RouteTable": {{ int .Values.cloudflareMesh.routeTable }},
        "ConnectTimeout": {{ .Values.cloudflareMesh.connectTimeout | quote }},
        "AdoptExistingRegistration": {{ .Values.cloudflareMesh.adoptExistingRegistration }}
{{- else }}
        "Type": {{ .Values.flannel.backend | quote }}
{{- end }}
      }
    }
