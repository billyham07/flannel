apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-flannel-ds
  namespace: {{ .Release.Namespace }}
  labels:
    tier: node
    app: flannel
spec:
  selector:
    matchLabels:
      app: flannel
  template:
    metadata:
      labels:
        tier: node
        app: flannel
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      hostNetwork: true
      priorityClassName: system-node-critical
      {{- with .Values.flannel.tolerations }}
      tolerations:
        {{- toYaml . | trim | nindent 8 }}
      {{- end }}
      {{- with .Values.flannel.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: flannel
      initContainers:
      - name: install-cni-plugin
        image: {{ .Values.flannel.flannel_cni.image.repository }}:{{ .Values.flannel.flannel_cni.image.tag }}
        command:
        - cp
        args:
        - -f
        - /flannel
        - /opt/cni/bin/flannel
        volumeMounts:
        - name: cni-plugin
          mountPath: /opt/cni/bin
      {{- if not .Values.flannel.skipCNIConfigInstallation }}
      - name: install-cni
        image: {{ .Values.flannel.image.repository }}{{- if .Values.flannel.image.digest }}@{{ .Values.flannel.image.digest }}{{- else }}:{{ .Values.flannel.image.tag }}{{- end }}
        command:
        - /opt/bin/install-conf
        args:
        - /etc/kube-flannel/cni-conf.json
        - /etc/cni/net.d/10-flannel.conflist
        volumeMounts:
        - name: cni
          mountPath: /etc/cni/net.d
        - name: flannel-cfg
          mountPath: /etc/kube-flannel/
      {{- end }}
      containers:
      - name: kube-flannel
        image: {{ .Values.flannel.image.repository }}{{- if .Values.flannel.image.digest }}@{{ .Values.flannel.image.digest }}{{- else }}:{{ .Values.flannel.image.tag }}{{- end }}
        command:
        - "/opt/bin/flanneld"
        {{- range .Values.flannel.args }}
        - {{ . | quote }}
        {{- end }}
        {{- if .Values.flannel.healthz.port }}
        - {{ printf "--healthz-port=%d" (int .Values.flannel.healthz.port) | quote }}
        {{- end }}
        {{- with .Values.flannel.resources }}
        resources:
          {{- toYaml . | trim | nindent 10 }}
        {{- end }}
        {{- if .Values.flannel.healthz.port }}
        ports:
        - name: healthz
          containerPort: {{ int .Values.flannel.healthz.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          {{- with .Values.flannel.healthz.livenessProbe }}
          {{- toYaml . | trim | nindent 10 }}
          {{- end }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          {{- with .Values.flannel.healthz.readinessProbe }}
          {{- toYaml . | trim | nindent 10 }}
          {{- end }}
        {{- end }}
        securityContext:
          {{- if .Values.cloudflareMesh.enabled }}
          privileged: true
          {{- else }}
          privileged: false
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
          {{- end }}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: EVENT_QUEUE_DEPTH
          value: "5000"
        - name: CONT_WHEN_CACHE_NOT_READY
          value: "false"
        {{- if .Values.cloudflareMesh.enabled }}
        {{- with .Values.cloudflareMesh.compat.clientVersion }}
        - name: CLOUDFLARE_MESH_CLIENT_VERSION
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.cloudflareMesh.compat.deviceVersion }}
        - name: CLOUDFLARE_MESH_DEVICE_VERSION
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.cloudflareMesh.compat.registrationAPI }}
        - name: CLOUDFLARE_MESH_REGISTRATION_API
          value: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.flannel.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: run
          mountPath: /run/flannel
        - name: flannel-cfg
          mountPath: /etc/kube-flannel/
        - name: xtables-lock
          mountPath: /run/xtables.lock
        {{- if .Values.cloudflareMesh.enabled }}
        - name: cloudflare-mesh-state
          mountPath: /var/lib/flannel/cloudflare-mesh
        - name: dev-net-tun
          mountPath: /dev/net/tun
        {{- end }}
{{- if .Values.netpol.enabled }}
      - name: kube-network-policies
        image: {{ .Values.netpol.image.repository }}:{{ .Values.netpol.image.tag }}
        command:
        - "/bin/netpol"
        {{- range .Values.netpol.args }}
        - {{ . | quote }}
        {{- end }}
        env:
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        resources:
          requests:
            cpu: "100m"
            memory: "50Mi"
        securityContext:
          privileged: true
          capabilities:
            add: ["NET_ADMIN"]
{{- end }}
      volumes:
{{- if .Values.netpol.enabled }}
      - name: lib-modules
        hostPath:
          path: /lib/modules
{{- end }}
      - name: run
        hostPath:
          path: /run/flannel
      - name: cni-plugin
        hostPath:
          path: {{ .Values.flannel.cniBinDir }}
      - name: cni
        hostPath:
          path: {{ .Values.flannel.cniConfDir }}
      - name: flannel-cfg
        configMap:
          name: kube-flannel-cfg
      - name: xtables-lock
        hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
      {{- if .Values.cloudflareMesh.enabled }}
      - name: cloudflare-mesh-state
        hostPath:
          path: {{ .Values.cloudflareMesh.stateHostPath }}
          type: DirectoryOrCreate
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      {{- end }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml .Values.global.imagePullSecrets | nindent 6 }}
      {{- end }}
