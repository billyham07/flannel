---
global:
  imagePullSecrets:
# - name: "a-secret-name"

# The IPv4 cidr pool to create on startup if none exists. Pod IPs will be
# chosen from this range.
podCidr: "10.244.0.0/16"
podCidrv6: ""

flannel:
  # kube-flannel image
  image:
    repository: ghcr.io/flannel-io/flannel
    tag: v0.28.9
    digest: ""
  flannel_cni:
    image:
      repository: ghcr.io/flannel-io/flannel-cni-plugin
      tag: v1.9.1-flannel3
  # cniBinDir is the directory to which the flannel CNI binary is installed.
  cniBinDir: "/opt/cni/bin"
  # cniConfDir is the directory where the CNI configuration is located.
  cniConfDir: "/etc/cni/net.d"
  # skipCNIConfigInstallation skips the installation of the flannel CNI config. This is useful when the CNI config is
  # provided externally.
  skipCNIConfigInstallation: false
  # flannel command arguments
  enableNFTables: false
  args:
  - "--ip-masq"
  - "--kube-subnet-mgr"
  # Extra environment variables for flanneld. This can override the injected
  # Kubernetes service host when the API is reached through a node underlay.
  extraEnv: []
  # Backend for kube-flannel. Backend should not be changed
  # at runtime. (vxlan, host-gw, wireguard, udp, cloudflare-mesh)
  # Documentation at https://github.com/flannel-io/flannel/blob/master/Documentation/backends.md
  backend: "vxlan"
  # Port used by the backend 0 means default value (VXLAN: 8472, Wireguard: 51821, UDP: 8285)
  #backendPort: 0
  # MTU to use for outgoing packets (VXLAN and Wiregurad) if not defined the MTU of the external interface is used.
  # mtu: 1500
  #
  # VXLAN Configs:
  #
  # VXLAN Identifier to be used. On Linux default is 1.
  #vni: 1
  # Enable VXLAN Group Based Policy (Default false)
  # GBP: false
  # Enable direct routes (default is false)
  # directRouting: false
  # MAC prefix to be used on Windows. (Defaults is 0E-2A)
  # macPrefix: "0E-2A"
  #
  # Wireguard Configs:
  #
  # UDP listen port used with IPv6
  # backendPortv6: 51821
  # Pre shared key to use
  # psk: 0
  # IP version to use on Wireguard
  # tunnelMode: "separate"
  # Persistent keep interval to use
  # keepaliveInterval: 0
  #
  cniConf: |
    {
      "name": "cbr0",
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "flannel",
          "delegate": {
            "hairpinMode": true,
            "isDefaultGateway": true
          }
        },
        {
          "type": "portmap",
          "capabilities": {
            "portMappings": true
          }
        }
      ]
    }
  #
  # General daemonset configs
  #
  resources:
    requests:
      cpu: 100m
      memory: 50Mi
  # Health check server configuration. Set port to a non-zero value to enable.
  # /healthz is the liveness endpoint; /readyz is the readiness endpoint.
  healthz:
    port: 8081
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 30
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
  tolerations:
  - effect: NoExecute
    operator: Exists
  - effect: NoSchedule
    operator: Exists
  nodeSelector: {}

netpol:
  enabled: false
  args:
  - "--hostname-override=$(MY_NODE_NAME)"
  - "--v=2"
  image:
    repository: registry.k8s.io/networking/kube-network-policies
    tag: v1.0.0

cloudflareMesh:
  enabled: false
  accountID: ""
  clusterName: "default"
  connectorPrefix: "flannel-"
  connectorHA: false
  meshCIDR: "100.96.0.0/12"
  routeTable: 51820
  mtu: 1280
  keepalivePeriod: "30s"
  secretPrefix: "cloudflare-mesh-node-"
  stateHostPath: "/var/lib/flannel/cloudflare-mesh"
  connectTimeout: "3m"
  # Emergency overrides for the native client fingerprint Cloudflare matches
  # this backend against. Leave empty to use the known-good built-in values.
  # Set them only when Cloudflare starts refusing enrollment because it retired
  # the WARP build the backend presents itself as; that way a cluster can be
  # unblocked without waiting for a new flannel image.
  compat:
    clientVersion: ""
    deviceVersion: ""
    registrationAPI: ""
  apiTokenSecret:
    name: "cloudflare-mesh-api-token"
    key: "api-token"
  operator:
    replicas: 2
    syncPeriod: "15s"
    # Reclaim WARP device registrations orphaned by re-enrolled nodes.
    # "dryrun" logs what it would delete without deleting it, "on" deletes,
    # "off" skips the API calls entirely. "on" and "dryrun" need the Zero Trust
    # scope on the API token.
    registrationGC: "dryrun"
    # Paced separately from syncPeriod: listing registrations is an
    # account-wide paginated call, while an orphan costs nothing to leave in
    # place for a few minutes.
    registrationGCPeriod: "10m"
    nodeSelector: ""
    extraEnv: []
    image:
      repository: ""
      tag: ""
      digest: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  coreDNSNodeHosts:
    enabled: true
    namespace: "kube-system"
    configMapName: "coredns"
    dataKey: "NodeHosts"
    hostnameSuffix: "-mesh"
    rolloutKind: "daemonset"
    rolloutName: "coredns"
